[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchainiq-langchain"
version = "0.1.0"
description = "LangChain tools for the Blockchain IQ x402 API — pay-per-call crypto market data, paid in USDC on Base via x402."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Townsvilledh" }]
keywords = ["langchain", "x402", "crypto", "market-data", "agents", "usdc", "base"]
dependencies = [
    "httpx>=0.27",
    "langchain-core>=0.3",
    "pydantic>=2",
]

[project.optional-dependencies]
evm = ["eth-account>=0.13"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["blockchainiq_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
